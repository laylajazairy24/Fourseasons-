<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Lab 3: Photo Carousel</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <h1>The Power of Sequencing</h1>
    <h2 id="story-title">Sequence One: Leaving Home</h2>

    <img
      id="image1"
      src="images/house.jpg"
      alt="beginning of the story"
      height="300"
    />
    <img
      id="image2"
      src="images/suitcase.jpg"
      alt="middle of the story"
      height="300"
    />
    <img id="image3" src="images/plane.jpg" alt="end of the story" height="300" />

    <p id="caption">
      Beginning: she is at home. Middle: she packs her suitcase. End: she flies
      away.
    </p>

    <button id="sequence-one">Sequence One</button>
    <button id="sequence-two">Sequence Two</button>

    <script src="script.js"></script>
  </body>
</html>
